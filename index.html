<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbitlab — launch &amp; orbital insertion simulator</title>
    <meta id="meta-description" name="description" content="Physics-based rocket launch and orbital insertion simulator: real launch vehicles, satellites, orbit presets, four camera views and engineering telemetry." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3CclipPath id='orbitlab-logo-delta'%3E%3Cpath d='M100 16 L162 176 L100 146 L38 176 Z' /%3E%3C/clipPath%3E%3CclipPath id='orbitlab-logo-front'%3E%3Crect x='0' y='112' width='200' height='100' /%3E%3C/clipPath%3E%3C/defs%3E%3Crect width='200' height='200' rx='44' fill='%230a1017'/%3E%3Cg style='--logo-ground: %230a1017' transform='translate(100 102) scale(0.86) translate(-100 -100)'%3E %3Cellipse cx='100' cy='112' rx='92' ry='30' transform='rotate(-18 100 112)' fill='none' stroke='%23ffffff' stroke-width='7' /%3E %3Cg clip-path='url(%23orbitlab-logo-delta)'%3E %3Crect x='0' y='16' width='200' height='160' fill='%23e4002b' /%3E %3Crect x='0' y='42.67' width='200' height='106.67' fill='%23ffffff' /%3E %3Crect x='0' y='69.33' width='200' height='53.33' fill='%231f3a9e' /%3E %3C/g%3E %3Cg transform='rotate(-18 100 112)' clip-path='url(%23orbitlab-logo-front)'%3E %3Cellipse cx='100' cy='112' rx='92' ry='30' fill='none' style='stroke: var(--logo-ground%2C %23080c13)' stroke-width='16' /%3E %3Cellipse cx='100' cy='112' rx='92' ry='30' fill='none' stroke='%23ffffff' stroke-width='7' /%3E %3C/g%3E %3Ccircle cx='186.4' cy='122.3' r='9' transform='rotate(-18 100 112)' fill='%23ffffff' style='stroke: var(--logo-ground%2C %23080c13)' stroke-width='4' /%3E %3C/g%3E%3C/svg%3E" />
    <!-- How a link to the site is shown where it is shared (LINE, Facebook, Telegram, X…). Those
         sites read these without running the page, so the picture's address is written out whole;
         the picture is the landing page's first screen (public/social/preview.jpg, npm run shots). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbitlab" />
    <meta property="og:title" content="Orbitlab — watch a real rocket fly to space" />
    <meta property="og:description" content="Real launch vehicles and real physics, from the launch pad to orbit, explained as they fly. Lessons, an orbit playground and the space station where it is now. In English, Thai and Russian; works offline." />
    <meta property="og:url" content="https://royin001.github.io/Orbitlab/" />
    <meta property="og:image" content="https://royin001.github.io/Orbitlab/social/preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Soyuz rocket on its launch pad, beside the words: Watch a real rocket fly to space" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#080c13" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- The web fonts are added in online mode only (src/ui/web-fonts.ts, roadmap S04). -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The Orbitlab mark (A1): a delta in the Thai flag's stripes with an orbit across it. Drawn once
         here and used by the top bar and the About dialog (<use href="#orbitlab-logo">); the favicon
         and the PWA icons are made from it by scripts/icons.mjs. The gap under the front of the orbit
         takes its colour from --logo-ground, the ground the mark sits on. -->
    <svg id="logo-sprite" width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="orbitlab-logo-delta"><path d="M100 16 L162 176 L100 146 L38 176 Z" /></clipPath>
        <clipPath id="orbitlab-logo-front"><rect x="0" y="112" width="200" height="100" /></clipPath>
        <symbol id="orbitlab-logo" viewBox="0 0 200 200">
          <ellipse cx="100" cy="112" rx="92" ry="30" transform="rotate(-18 100 112)" fill="none" stroke="#ffffff" stroke-width="7" />
          <g clip-path="url(#orbitlab-logo-delta)">
            <rect x="0" y="16" width="200" height="160" fill="#e4002b" />
            <rect x="0" y="42.67" width="200" height="106.67" fill="#ffffff" />
            <rect x="0" y="69.33" width="200" height="53.33" fill="#1f3a9e" />
          </g>
          <g transform="rotate(-18 100 112)" clip-path="url(#orbitlab-logo-front)">
            <ellipse cx="100" cy="112" rx="92" ry="30" fill="none" style="stroke: var(--logo-ground, #080c13)" stroke-width="16" />
            <ellipse cx="100" cy="112" rx="92" ry="30" fill="none" stroke="#ffffff" stroke-width="7" />
          </g>
          <circle cx="186.4" cy="122.3" r="9" transform="rotate(-18 100 112)" fill="#ffffff" style="stroke: var(--logo-ground, #080c13)" stroke-width="4" />
        </symbol>
      </defs>
    </svg>
    <div id="app">
      <header id="topbar">
        <!-- the product name is the way home (owner, 2026-10-01) -->
        <a class="brand" href="#/home" data-i18n-title="mode.home">
          <svg class="brand-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><use href="#orbitlab-logo" /></svg>
          <span class="brand-name" aria-hidden="true">ORBIT<span>LAB</span></span>
        </a>
        <!-- One app, sections at three levels (src/ui/app-mode.ts, roadmap S01).
             The switch is drawn by src/ui/section-nav.ts: a tab per section,
             each opening the menu of its levels, or on a phone one button
             opening a table of them. The levels are plain links: the route is
             the URL hash, so every face can be linked to and Back works. -->
        <div class="topbar-nav">
          <nav id="section-nav" class="section-nav" data-i18n-aria-label="section.nav"></nav>
        </div>
        <div class="topbar-right">
          <!-- S04: offline or online data (src/provider/), and every dataset's "data as of" -->
          <button id="btn-data-mode" class="quiet-btn data-mode-btn" type="button" data-mode="offline">
            <svg class="data-glyph" aria-hidden="true" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15.5h8.2a3.3 3.3 0 0 0 .5-6.6 4.6 4.6 0 0 0-8.9 1A2.8 2.8 0 0 0 6 15.5z"/><path class="data-glyph-off" d="M3 3l14 14"/></svg>
            <span id="data-mode-label">Offline</span>
          </button>
          <button id="btn-help" class="quiet-btn" type="button"></button>
          <button id="btn-profile" class="quiet-btn profile-button" type="button">
            <span aria-hidden="true">◉</span><span id="profile-label"></span>
          </button>
          <button id="btn-work" class="quiet-btn" type="button" data-i18n-title="work.title" data-i18n-aria-label="work.title">
            <span aria-hidden="true">▤</span><span data-i18n="work.title">My work</span>
          </button>
          <!-- About: the maker's credit, and the physics and its sources (ui/dialogs.ts AboutDialog) -->
          <button id="btn-about" class="quiet-btn" type="button" data-i18n-aria-label="about.button" data-i18n-title="about.button">
            <span aria-hidden="true">ⓘ</span><span data-i18n="about.button">About</span>
          </button>
          <button id="btn-camera-plan" class="quiet-btn" type="button" data-i18n-aria-label="ctl.cameraSequence" data-i18n-title="ctl.cameraSequence">
            <span aria-hidden="true">◈</span><span data-i18n="ctl.cameraSequence">Camera sequence</span>
          </button>
          <label class="lang">
            <span data-i18n="app.language">Language</span>
            <select id="lang-select" data-i18n-aria-label="app.language">
              <option value="en">English</option>
              <option value="ru">Русский</option>
              <option value="th">ไทย</option>
            </select>
          </label>
        </div>
      </header>
      <p id="profile-storage-notice" class="profile-storage-notice" role="status" hidden></p>
      <section id="first-use-guide"></section>
      <nav class="mobile-workspace-nav" aria-label="Workspace" data-i18n-aria-label="nav.workspace">
        <a href="#setup" data-i18n="nav.setup">Mission</a>
        <a href="#viewport" data-i18n="nav.flight">Flight</a>
        <a href="#telemetry" data-i18n="nav.telemetry">Data</a>
      </nav>

      <main class="workspace">
        <aside id="setup" class="panel setup" tabindex="-1"></aside>

        <section class="flight-column">
          <div id="viewport" class="panel viewport">
            <canvas id="gl"></canvas>
            <canvas id="map" class="overlay hidden"></canvas>
            <canvas id="onboard" class="overlay hidden"></canvas>
            <div id="loading" class="scene-loading"><span id="loading-text" data-i18n="misc.loading">Loading textures…</span></div>
            <div class="scene-ui">
              <div class="scene-top">
                <div class="mission-title">
                  <span class="eyebrow" id="mission-eyebrow" data-i18n="narr.mission">MISSION</span>
                  <h2 id="mission-name"></h2>
                </div>
                <div class="sim-state" id="sim-state" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="sim-state-text"></span></div>
              </div>
              <div class="scene-mid">
              <div class="camera-tabs" role="group" id="camera-tabs">
                <button class="cam-btn active" type="button" data-cam="exterior" aria-pressed="true"><span aria-hidden="true">◈</span><span data-i18n="ctl.camera.exterior"></span></button>
                <button class="cam-btn" type="button" data-cam="onboard" aria-pressed="false"><span aria-hidden="true">▣</span><span data-i18n="ctl.camera.onboard"></span></button>
                <button class="cam-btn" type="button" data-cam="space" aria-pressed="false"><span aria-hidden="true">✧</span><span data-i18n="ctl.camera.space"></span></button>
                <button class="cam-btn" type="button" data-cam="map" aria-pressed="false"><span aria-hidden="true">◎</span><span data-i18n="ctl.camera.map"></span></button>
                <!-- R2.2: hand the view back to the camera programme (src/render/camera-policy.ts) -->
                <button id="btn-cinematic" class="cam-btn cam-auto active" type="button" aria-pressed="true" data-i18n-title="ctl.camera.cinematicTitle"><span aria-hidden="true">▶</span><span data-i18n="ctl.camera.cinematic"></span></button>
              </div>
              <div class="camera-tools">
                <button id="btn-frames" class="tool-btn" type="button" aria-pressed="false" aria-expanded="false" data-i18n-title="ctl.frames"><svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13V3M5 5l2-2 2 2M7 13h10M15 11l2 2-2 2M7 13l-4.5 4.5M2.5 14.5v3h3"/><path d="M7 7.5a5.5 5.5 0 0 1 5.5 5.5" stroke-width="1.2" stroke-dasharray="1.6 1.6"/></svg></button>
                <button id="btn-glow" class="tool-btn active" type="button" aria-pressed="true" data-i18n-title="ctl.glow"><span aria-hidden="true">✦</span></button>
                <button id="btn-sound" class="tool-btn" type="button" aria-pressed="false" data-i18n-title="ctl.sound" data-i18n-aria-label="ctl.sound"><span aria-hidden="true">♪</span></button>
                <button id="btn-fullscreen" class="tool-btn" type="button" data-i18n-title="ctl.fullscreen"><span aria-hidden="true">⛶</span></button>
              </div>
              </div>
              <div class="scene-fill">
                <div id="ticker" aria-live="polite"></div>
              </div>
              <div class="scene-bottom" id="scene-bottom">
                <div id="narration"></div>
                <div class="scene-hint"><span id="cam-hint"></span></div>
              </div>
              <!-- The instrument card is a floating window over the scene, not a
                   cell of the overlay's grid: it is a direct child of .scene-ui so
                   that its absolute position resolves against the whole viewport.
                   Inside .scene-fill it could not — that band carries layout
                   containment, which makes it the containing block. Last, so the
                   window paints over the narration band it can be dragged across.
                   src/ui/hud.ts moves this node into the telemetry panel when the
                   card is docked. -->
              <div id="hud"></div>
            </div>
            <!-- The launch viewer's own overlay and the landing page. Inside the
                 viewport so that full screen takes them along. -->
            <div id="watch-ui" hidden></div>
            <!-- Explore's card at the end of a flight (src/ui/explore-debrief.ts) -->
            <div id="explore-debrief" hidden></div>
            <section id="home-screen" hidden></section>
            <!-- Phase 3: the Build section (src/ui/build/build-screen.ts), over the same scene -->
            <section id="build-screen" hidden></section>
            <!-- O01: the Orbit section's playground (src/ui/orbit/playground.ts) -->
            <section id="orbit-playground" hidden></section>
          </div>

          <section id="controls" class="panel playback">
            <div id="timeline"></div>
            <div class="ctl-row">
              <div class="ctl-group">
                <!-- R2.1: brings back the mission setup after launch (src/ui/flight-lifecycle.ts) -->
                <button id="btn-setup" class="ctl-btn setup-toggle" type="button" aria-controls="setup" aria-expanded="false" data-i18n-title="ctl.setupTitle" hidden><span aria-hidden="true">⚙</span><span data-i18n="ctl.setup">Setup</span></button>
                <button id="btn-prev" class="ctl-btn" type="button" data-i18n-title="ctl.prev"><span aria-hidden="true">⏮</span></button>
                <button id="btn-play" class="ctl-btn play-btn" type="button" data-i18n-title="ctl.play"><span aria-hidden="true">▶</span></button>
                <button id="btn-skip" class="ctl-btn" type="button" data-i18n-title="ctl.skip"><span aria-hidden="true">⏭</span></button>
                <button id="btn-live" class="ctl-btn live-btn" type="button" data-i18n="ctl.live" data-i18n-title="ctl.liveTitle">Live</button>
                <button id="btn-abort" class="ctl-btn abort-btn" type="button" data-i18n="ctl.abort" data-i18n-title="ctl.abortTitle" hidden>Abort</button>
              </div>
              <div class="mission-clock">
                <span id="clock">T-00:10</span>
                <small id="clock-context"></small>
              </div>
              <label class="warp"><span data-i18n="ctl.warp">Warp</span>
                <select id="warp-select"></select>
              </label>
            </div>
            <small id="achieved-warp" hidden></small>
          </section>
          <section id="mission-result" class="panel" hidden></section>
          <section id="flown-result" class="panel" hidden></section>
          <section id="rigid-controls" class="panel" hidden></section>
          <section id="toru-controls" class="panel" hidden></section>
        </section>

        <aside id="telemetry" class="panel telemetry" tabindex="-1"></aside>
      </main>

      <!-- A04 / R2.1: a phone's compact flight bar while the playback controls are scrolled away -->
      <div id="mobile-flight-bar" class="mobile-flight-bar" data-active="false" role="group" data-i18n-aria-label="ctl.flightBar">
        <button id="mfb-play" class="ctl-btn play-btn" type="button">▶</button>
        <span id="mfb-clock" class="mfb-clock"></span>
        <span id="mfb-mode" class="mfb-mode"></span>
        <a class="mfb-up" href="#viewport" data-i18n="nav.flight">Flight</a>
      </div>

      <footer id="footer">
        <span data-i18n="app.footerModel">Earth · Newtonian flight model</span>
        <span data-i18n="app.footerNote">Educational simulation · approximate vehicle data</span>
        <span class="footer-credit"><span id="footer-credit">Made by Royin</span> · <button id="footer-about" class="link-btn" type="button" data-i18n="about.button">About</button></span>
      </footer>

      <dialog id="about-dialog" class="dialog"></dialog>
      <dialog id="work-dialog" class="dialog"></dialog>
      <dialog id="profile-dialog" class="dialog"></dialog>
      <dialog id="camera-dialog" class="dialog"></dialog>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
