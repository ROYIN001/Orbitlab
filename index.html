<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbitlab — launch & orbital insertion simulator</title>
    <meta name="description" content="Physics-based rocket launch and orbital insertion simulator: real launch vehicles, satellites, orbit presets, four camera views and engineering telemetry." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='18' fill='%232a6fd6'/%3E%3Cellipse cx='32' cy='36' rx='28' ry='9' fill='none' stroke='%23f2b134' stroke-width='3'/%3E%3Cpath d='M42 10l4 4-10 12-4-4z' fill='%23e8e8e8'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-C9oE9Xzu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-NmxR_UlN.css">
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">◉</span>
          <span class="title" data-i18n="app.title">Orbitlab</span>
          <span class="subtitle" data-i18n="app.subtitle"></span>
        </div>
        <div class="topbar-right">
          <button id="btn-toggle-setup" class="icon-btn" title="Mission setup">☰</button>
          <label class="lang"><span data-i18n="app.language">Language</span>
            <select id="lang-select">
              <option value="en">English</option>
              <option value="ru">Русский</option>
              <option value="th">ไทย</option>
            </select>
          </label>
          <button id="btn-about" class="icon-btn" data-i18n-title="misc.about">?</button>
          <button id="btn-toggle-tel" class="icon-btn" title="Telemetry">📈</button>
        </div>
      </header>
      <aside id="setup" class="panel"></aside>
      <main id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="map" class="overlay hidden"></canvas>
        <canvas id="onboard" class="overlay hidden"></canvas>
        <div id="hud"></div>
        <div id="ticker"></div>
        <div id="loading" data-i18n="misc.loading">Loading textures…</div>
        <div id="controls">
          <div class="ctl-group">
            <button id="btn-play" class="ctl-btn" data-i18n-title="ctl.play">▶</button>
            <label class="warp"><span data-i18n="ctl.warp">Warp</span>
              <select id="warp-select"></select>
            </label>
            <button id="btn-skip" class="ctl-btn" data-i18n-title="ctl.skip">⏭</button>
          </div>
          <div class="ctl-group cameras">
            <button class="cam-btn active" data-cam="exterior" data-i18n="ctl.camera.exterior"></button>
            <button class="cam-btn" data-cam="onboard" data-i18n="ctl.camera.onboard"></button>
            <button class="cam-btn" data-cam="space" data-i18n="ctl.camera.space"></button>
            <button class="cam-btn" data-cam="map" data-i18n="ctl.camera.map"></button>
          </div>
          <div id="cam-hint" class="hint"></div>
        </div>
      </main>
      <aside id="telemetry" class="panel"></aside>
      <div id="about" class="modal hidden">
        <div class="modal-box">
          <h2 data-i18n="misc.about"></h2>
          <p data-i18n="misc.aboutText"></p>
          <p class="small">Earth textures: three.js examples (NASA Blue Marble). Vehicle figures are public data rounded to ±10 %.</p>
          <button id="btn-about-close" class="btn">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
