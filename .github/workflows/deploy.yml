name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # R02: every day the site is built again with fresh data snapshots (satellites, space weather),
  # fetched at build time and deployed with it, never committed; the committed ones are the baseline
  # 17:43 UTC is 00:43 Bangkok: the refreshed data is live before the Thai school day, and the slot is
  # quieter than 03:xx UTC (scheduled runs at 03:17 were measured starting up to 6.5 h late)
  schedule:
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # a scheduled run only refreshes the data: its code was tested when it merged (the snapshot tests, the build
      # and the journeys below still run)
      - if: github.event_name != 'schedule'
        run: npm test
      # the tests ran on the committed snapshots; the build takes fresh ones (a source that fails keeps its baseline)
      - run: npm run snapshots
      # ...so the fresh ones are checked again before they ship: the tests that read each snapshot's schema and
      # contents (space weather, the satellite catalogue, the Earth's orientation, and the solar activity built on them)
      - run: npx vitest run tests/data-provider.test.ts tests/satellite-catalogue.test.ts tests/earth-orientation.test.ts tests/activity.test.ts
      - run: npm run build
      # the build that deploys, in a real browser: every journey in tests/browser/journeys/
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/run.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-screenshots
          path: tests/browser/screenshots/
          if-no-files-found: ignore
      # re-running an old run would put an older main back on the site: deploy only main's current tip
      # (for workflow_dispatch and schedule runs github.sha is main's tip already)
      - name: Deploy only main's tip
        run: |
          git fetch --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$GITHUB_SHA" != "$tip" ]; then
            echo "::error title=deploy skipped::this run is not main's tip ($GITHUB_SHA, main is $tip): an old run was re-run; deploy skipped — use workflow_dispatch instead"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
