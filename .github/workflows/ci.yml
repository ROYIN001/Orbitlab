name: CI

on:
  # a change to Markdown files only (README, CHANGELOG, docs/*.md) skips CI, except the two documents the
  # app and the tests read; anything else under docs/ (evidence JSON, pictures) still runs it
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/ROADMAP-PART2-3.md'     # read by tests/section-plan.test.ts
      - 'docs/SIXDOF-VEHICLE-DATA.md' # bundled by src/ui/dialogs.ts
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/ROADMAP-PART2-3.md'
      - 'docs/SIXDOF-VEHICLE-DATA.md'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # the default suite (tests/heavy and tests/sixdof-fleet excluded by vite.config.ts) split three ways
  test:
    runs-on: ubuntu-latest
    # a guard against runner speed varying about 2x between runs, not the target (the plan's is a 12-minute PR CI)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # the production build (the typecheck runs in its own job), kept as an artifact for browser-smoke
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - if: hashFiles('scripts/bundle-budget.mjs') != ''
        run: node scripts/bundle-budget.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  # The app in a real browser (tests/browser/): the smoke journeys on the build job's dist,
  # served under /Orbitlab/ as GitHub Pages serves it. The deploy runs the full set.
  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: tests/browser/screenshots/
          if-no-files-found: ignore
