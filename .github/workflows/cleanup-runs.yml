name: Clean up failed and cancelled runs

# Manual only. Deletes completed workflow runs whose conclusion is failure,
# cancelled, timed_out or startup_failure, so the Actions list stays readable.
# Runs on an open PR's head commit are kept so that PR keeps its check results.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: true

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Delete failed and cancelled runs
        shell: bash
        run: |
          set -euo pipefail
          keep=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.sha' | sort -u)
          gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[]
                  | select(.conclusion == "failure" or .conclusion == "cancelled"
                           or .conclusion == "timed_out" or .conclusion == "startup_failure")
                  | "\(.id) \(.head_sha) \(.conclusion) \(.name)"' > runs.txt
          deleted=0; skipped=0; failed=0
          while read -r id sha conclusion name; do
            if grep -qx "$sha" <<<"$keep"; then
              skipped=$((skipped + 1)); continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $id ($conclusion, $name)"; deleted=$((deleted + 1))
            elif gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent; then
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete run $id"; failed=$((failed + 1))
            fi
          done < runs.txt
          verb=$([ "$DRY_RUN" = "true" ] && echo "Would delete" || echo "Deleted")
          echo "$verb $deleted runs; kept $skipped on open PR heads; $failed failed." | tee -a "$GITHUB_STEP_SUMMARY"
