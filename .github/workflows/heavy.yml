# Complete six-DOF flight suites stay separate from the default PR suite.
# All entry points use one discovery, reviewed heavy inventory and exact-source union.
name: Heavy suites

on:
  schedule:
    - cron: '7 20 * * 0'
    - cron: '7 20 1 * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [heavy, sixdof-fleet, both]
        default: heavy
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      heavy_timeout:
        type: number
        default: 60
      max_parallel:
        type: number
        default: 33

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.list.outputs.heavy }}
      fleet: ${{ steps.list.outputs.fleet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: node --test tests/verification/*.test.mjs
      - name: Collect all requested files and cases without executing flights
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          suite="$REQUESTED_SUITE"
          if [ -z "$suite" ]; then
            if [ "$EVENT_SCHEDULE" = '7 20 1 * *' ]; then suite=sixdof-fleet; else suite=heavy; fi
          fi
          node scripts/verification/create-plan.mjs "$suite"
      - id: list
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('tests/browser/artifacts/verification/plan.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `heavy=${JSON.stringify(plan.suites.heavy?.files ?? [])}\nfleet=${JSON.stringify(plan.suites['sixdof-fleet']?.files ?? [])}\n`);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-plan
          path: |
            tests/browser/artifacts/verification/plan.json
            tests/browser/artifacts/verification/collection.json
          if-no-files-found: error

  heavy:
    needs: plan
    if: needs.plan.outputs.heavy != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.heavy_timeout || 60 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel || 33 }}
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.heavy) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scientific-plan
          path: tests/browser/artifacts/verification
      - run: node scripts/audit-heavy/run-heavy-file.mjs "${{ matrix.file }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-heavy-${{ strategy.job-index }}
          path: tests/browser/artifacts/verification/heavy-*
          if-no-files-found: warn
          retention-days: 14

  sixdof-fleet:
    needs: plan
    if: needs.plan.outputs.fleet != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.fleet) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scientific-plan
          path: tests/browser/artifacts/verification
      - name: Execute this discovered fleet file
        env:
          TEST_FILE: ${{ matrix.file }}
        run: |
          name="$(basename "$TEST_FILE" .test.ts)"
          node scripts/verification/run-vitest.mjs "sixdof-fleet-$name"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-fleet-${{ strategy.job-index }}
          path: tests/browser/artifacts/verification/sixdof-fleet-*
          if-no-files-found: warn
          retention-days: 14

  coverage:
    needs: [plan, heavy, sixdof-fleet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scientific-plan
          path: tests/browser/artifacts/verification
      - if: needs.plan.outputs.heavy != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: scientific-heavy-*
          path: tests/browser/artifacts/verification/results
          merge-multiple: true
      - if: needs.plan.outputs.fleet != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: scientific-fleet-*
          path: tests/browser/artifacts/verification/results
          merge-multiple: true
      - if: always()
        run: node scripts/verification/aggregate.mjs tests/browser/artifacts/verification/plan.json tests/browser/artifacts/verification/results tests/browser/artifacts/verification/union.json
        env:
          VERIFICATION_JOB_RESULTS: '{"plan":"${{ needs.plan.result }}","heavy":"${{ needs.heavy.result }}","sixdof-fleet":"${{ needs.sixdof-fleet.result }}"}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-verification-union
          path: tests/browser/artifacts/verification/union.json
          if-no-files-found: warn
