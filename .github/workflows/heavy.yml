# The slow suites, off the pull-request gate: tests/heavy (complete six-DOF flights, about 2 h 30 min of
# runner time, one job per file so that no job nears its limit) and
# tests/sixdof-fleet (the fleet acceptance matrix flown in six-DOF, about 2 h 40 min) are excluded from
# `npm test` by vite.config.ts and would hold every PR for hours, so they run here on a schedule
# (heavy weekly, sixdof-fleet monthly) or on demand from the Actions tab.
name: Heavy suites

on:
  schedule:
    - cron: '7 20 * * 0'   # heavy: Sunday 20:07 UTC (Monday 03:07 Bangkok)
    - cron: '7 20 1 * *'   # sixdof-fleet: the 1st of each month, 20:07 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [heavy, sixdof-fleet, both]
        default: heavy

permissions:
  contents: read

jobs:
  # every file in tests/heavy/*.test.ts, listed at run time: the suite flown in one job ran past an hour
  # (monte-carlo-falcon9-standard alone takes 37 min on a runner), so each file gets a job of its own
  heavy-files:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 20 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'heavy' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "files=$(ls tests/heavy/*.test.ts | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  heavy:
    needs: heavy-files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.heavy-files.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.heavy.config.ts ${{ matrix.file }}

  sixdof-fleet:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 20 1 * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'sixdof-fleet' || inputs.suite == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # every file in tests/sixdof-fleet/*.test.ts, one job each; add a line here when a file is added there
        file:
          - tests/sixdof-fleet/ariane64-h2a202-protonm-starship.test.ts
          - tests/sixdof-fleet/dedicated.test.ts
          - tests/sixdof-fleet/electron-longmarch5-vegac-falcon9.test.ts
          - tests/sixdof-fleet/h3-atlasv551-angaraa5-pslvxl.test.ts
          - tests/sixdof-fleet/vulcan-soyuz21b-falconheavy-longmarch3be.test.ts
          - tests/sixdof-fleet/wind.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.sixdof-fleet.config.ts ${{ matrix.file }}
