name: Heavy audit acceptance

on:
  push:
    branches: [codex/audit-acceptance]
    paths:
      - .github/workflows/heavy-audit.yml
      - .github/workflows/heavy.yml
      - scripts/audit-heavy/**
      - scripts/verification/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Preserve the audit's six concurrent jobs and generous job ceiling; original test timeouts apply.
    uses: ./.github/workflows/heavy.yml
    with:
      suite: heavy
      heavy_timeout: 360
      max_parallel: 6
